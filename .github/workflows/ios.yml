name: iOS Core Tests

# 在 macOS 运行器上验证 Swift 核心逻辑。
# 公开仓库的 macOS 分钟数免费，因此没有 Mac 也能拿到真实的编译与测试结果；
# 有 Mac 时本地 `swift test` 会更快。
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run core tests
        working-directory: ios/VitreLensCore
        run: swift test 2>&1 | tail -40

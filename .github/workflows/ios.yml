name: iOS

# 公开仓库的 macOS 运行器免费，因此没有 Mac 也能拿到真实的编译结果：
#   core  —— swift test，跑 VitreLensCore 的单元测试与 Android 对拍
#   app   —— xcodegen 生成工程后 xcodebuild 编译模拟器版本，能抓出 SwiftUI/Metal 的编译错误
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: swift test
        working-directory: ios/VitreLensCore
        run: swift test

  app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild -project VitreLens.xcodeproj \
            -scheme VitreLens \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Render glass presets on simulator
        working-directory: ios
        run: |
          set -euo pipefail
          DEV=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7]( Pro)?' || echo "iPhone 16")
          echo "使用模拟器: $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find build/Build/Products -name "VitreLens.app" -maxdepth 3 | head -1)
          echo "安装 $APP"
          xcrun simctl install "$DEV" "$APP"
          SIMCTL_CHILD_VITRELENS_SNAPSHOT=1 xcrun simctl launch "$DEV" com.vitrelens.app || true
          # 等渲染完成
          for i in $(seq 1 40); do
            CONTAINER=$(xcrun simctl get_app_container "$DEV" com.vitrelens.app data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/backend.txt" ]; then break; fi
            sleep 2
          done
          mkdir -p artifacts
          cp -v "$CONTAINER"/Documents/*.jpg artifacts/ || true
          cp -v "$CONTAINER"/Documents/backend.txt artifacts/ || true
          ls -lh artifacts

      - name: Upload preset renders
        uses: actions/upload-artifact@v4
        with:
          name: ios-glass-presets
          path: ios/artifacts
